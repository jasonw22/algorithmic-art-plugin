<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="sketch-title">Algorithmic Art — 3D</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #e0e0e0; }

  /* ---- Canvas ---- */
  #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  #canvas-container canvas { display: block; }

  /* ---- Sidebar toggle ---- */
  #sidebar-toggle {
    position: fixed; top: 12px; right: 12px; z-index: 30;
    background: rgba(30,30,30,0.7); color: #ccc; border: 1px solid #555;
    width: 36px; height: 36px; border-radius: 6px; cursor: pointer;
    font-size: 18px; display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  #sidebar-toggle:hover { background: rgba(60,60,60,0.9); }

  /* ---- Sidebar ---- */
  #sidebar {
    position: fixed; top: 0; right: 0; z-index: 20;
    width: 320px; height: 100vh; overflow-y: auto; overflow-x: hidden;
    background: rgba(22,22,22,0.92); backdrop-filter: blur(12px);
    border-left: 1px solid #333; padding: 16px;
    transform: translateX(100%); transition: transform 0.25s ease;
  }
  #sidebar.open { transform: translateX(0); }

  #sidebar h1 { font-size: 1.2em; color: #fff; margin-bottom: 4px; }
  #sidebar .concept { font-size: 0.8em; color: #999; font-style: italic; margin-bottom: 16px; line-height: 1.4; }

  /* ---- Sections ---- */
  .ctrl-section { margin-bottom: 20px; }
  .ctrl-section h3 {
    font-size: 0.85em; font-weight: 600; color: #aaa; text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 10px; padding-bottom: 4px; border-bottom: 1px solid #333;
  }

  /* ---- Controls ---- */
  .ctrl-group { margin-bottom: 14px; }
  .ctrl-group label { display: block; font-size: 0.8em; color: #ccc; margin-bottom: 4px; }
  .ctrl-row { display: flex; align-items: center; gap: 10px; }

  .ctrl-row input[type="range"] {
    flex: 1; height: 4px; -webkit-appearance: none; appearance: none;
    background: #444; border-radius: 2px; outline: none;
  }
  .ctrl-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: #d97757; border-radius: 50%; cursor: pointer;
  }
  .ctrl-row input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; background: #d97757;
    border-radius: 50%; border: none; cursor: pointer;
  }
  .ctrl-val {
    font-family: 'Courier New', monospace; font-size: 0.75em; color: #888;
    min-width: 50px; text-align: right;
  }

  select.ctrl-select {
    width: 100%; padding: 6px 8px; background: #2a2a2a; color: #ddd;
    border: 1px solid #444; border-radius: 4px; font-size: 0.8em; cursor: pointer;
  }

  input[type="color"].ctrl-color {
    width: 32px; height: 28px; border: 1px solid #444; border-radius: 4px;
    background: none; padding: 0; cursor: pointer;
  }
  .color-hex { font-family: 'Courier New', monospace; font-size: 0.75em; color: #888; }

  input[type="checkbox"].ctrl-check {
    width: 16px; height: 16px; accent-color: #d97757; cursor: pointer;
  }

  /* ---- Seed controls ---- */
  .seed-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .seed-input {
    flex: 1; padding: 6px 8px; background: #2a2a2a; color: #ddd;
    border: 1px solid #444; border-radius: 4px; font-family: 'Courier New', monospace;
    font-size: 0.85em; text-align: center;
  }
  .seed-input:focus { outline: none; border-color: #d97757; }

  /* ---- Buttons ---- */
  .btn {
    padding: 6px 12px; border: 1px solid #555; border-radius: 4px;
    background: #333; color: #ddd; font-size: 0.8em; cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover { background: #4a4a4a; }
  .btn-accent { background: #d97757; border-color: #d97757; color: #fff; }
  .btn-accent:hover { background: #c4613f; }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-row .btn { flex: 1; text-align: center; }
</style>
</head>
<body>

<div id="canvas-container"></div>
<button id="sidebar-toggle" title="Toggle controls">&#9776;</button>

<!-- ── SIDEBAR ── -->
<div id="sidebar">
  <h1 id="display-title"></h1>
  <div class="concept" id="display-concept"></div>

  <!-- Seed section — always present -->
  <div class="ctrl-section" id="section-seed">
    <h3>Seed</h3>
    <div class="seed-row">
      <input type="number" class="seed-input" id="seed-input" value="12345">
    </div>
    <div class="btn-row">
      <button class="btn" id="btn-seed-prev">&larr; Prev</button>
      <button class="btn" id="btn-seed-next">Next &rarr;</button>
      <button class="btn btn-accent" id="btn-seed-random">Random</button>
    </div>
  </div>

  <!-- Parameter sections are generated here by the template engine -->
  <div id="param-sections"></div>

  <!-- Actions section — always present -->
  <div class="ctrl-section" id="section-actions">
    <h3>Actions</h3>
    <div class="btn-row">
      <button class="btn" id="btn-pause">Pause</button>
      <button class="btn" id="btn-reset">Reset</button>
    </div>
    <div class="btn-row" style="margin-top: 6px;">
      <button class="btn" id="btn-png">Export PNG</button>
    </div>
  </div>
</div>

<script type="module">
// ═══════════════════════════════════════════════════════════════
// DO NOT MODIFY ABOVE THIS LINE — TEMPLATE INFRASTRUCTURE
// ═══════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════
// SECTION 1: METADATA — Fill in for each piece
// ═══════════════════════════════════════════════════════════════
const SKETCH_META = {
  title: "Untitled",
  concept: "",
  technique: "",
  // Rendering mode:
  //   "scene"  — Three.js scene graph (geometry + lights + camera). Use for 3D
  //              objects, particle systems, instanced meshes, generative sculptures.
  //   "shader" — Full-screen fragment shader (GLSL). Use for raymarching, SDFs,
  //              fractals, volumetric effects, reaction-diffusion on GPU.
  renderMode: "scene"
};

// ═══════════════════════════════════════════════════════════════
// SECTION 2: PARAMETERS — Define interactive controls
//
// Same format as the 2D template:
//   Slider:   { value: 0.5, min: 0, max: 1, step: 0.01, label: "Name", folder: "Section" }
//   Dropdown: { value: "opt1", options: ["opt1", "opt2"], label: "Name", folder: "Section" }
//   Color:    { value: "#ff0000", type: "color", label: "Name", folder: "Section" }
//   Boolean:  { value: true, label: "Name", folder: "Section" }
// ═══════════════════════════════════════════════════════════════
const PARAMS = {
  // example: { value: 5, min: 1, max: 20, step: 1, label: "Count", folder: "Structure" }
};

// ═══════════════════════════════════════════════════════════════
// SECTION 3: SKETCH LOGIC — Your algorithm goes here
//
// Which functions you implement depends on renderMode:
//
// ── renderMode: "scene" ──────────────────────────────────────
//   sceneSetup(THREE, scene, camera, renderer, params, seed)
//     Called once. Add meshes, lights, helpers to `scene`.
//     Configure `camera` (PerspectiveCamera, position already set).
//     Return an optional state object for use in sceneAnimate.
//
//   sceneAnimate(THREE, scene, camera, state, params, time, delta)
//     Called every frame. `time` is seconds since start.
//     `delta` is seconds since last frame.
//     Mutate scene objects, camera, state as needed.
//
// ── renderMode: "shader" ────────────────────────────────────
//   shaderUniforms(params, seed)
//     Return a Three.js uniforms object. The template automatically
//     provides: u_time (float), u_resolution (vec2), u_mouse (vec2).
//     Add your own uniforms here — they will be merged.
//
//   fragmentShader()
//     Return a GLSL fragment shader string. Available built-in uniforms:
//       uniform float u_time;
//       uniform vec2  u_resolution;
//       uniform vec2  u_mouse;
//     Plus any uniforms you defined in shaderUniforms().
//
//   shaderAnimate(uniforms, params, time) [optional]
//     Called every frame. Update uniform values from params.
//     u_time is updated automatically — only implement this if you
//     need to sync additional uniforms to params changes.
//
// ═══════════════════════════════════════════════════════════════

// --- Scene mode functions (implement these for renderMode: "scene") ---

function sceneSetup(THREE, scene, camera, renderer, params, seed) {
  // Add meshes, lights, etc. to scene
  // Return a state object if needed (or undefined)
}

function sceneAnimate(THREE, scene, camera, state, params, time, delta) {
  // Per-frame updates
}

// --- Shader mode functions (implement these for renderMode: "shader") ---

function shaderUniforms(params, seed) {
  // Return { uniformName: { value: ... }, ... }
  return {};
}

function fragmentShader() {
  // Return a GLSL fragment shader string
  return `
    uniform float u_time;
    uniform vec2 u_resolution;
    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution;
      gl_FragColor = vec4(uv, 0.5 + 0.5 * sin(u_time), 1.0);
    }
  `;
}

function shaderAnimate(uniforms, params, time) {
  // Optional: update custom uniforms per frame
}

// ═══════════════════════════════════════════════════════════════
// DO NOT MODIFY BELOW THIS LINE — TEMPLATE ENGINE
// ═══════════════════════════════════════════════════════════════

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

(function () {
  "use strict";

  let renderer, scene, camera, controls, clock;
  let animationId = null;
  let isPaused = false;
  let sketchState = undefined;
  let shaderMesh = null;
  let shaderUniformsObj = null;

  if (!window.paramValues) window.paramValues = {};
  const paramValues = window.paramValues;
  let currentSeed = 12345;

  // ── Seeded PRNG (mulberry32) ──
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  // Expose seeded random globally so sketch code can use it
  window.seededRandom = mulberry32(currentSeed);

  // ── Build sidebar controls from PARAMS ──
  function buildControls() {
    for (const key in PARAMS) paramValues[key] = PARAMS[key].value;

    const container = document.getElementById("param-sections");
    container.innerHTML = "";

    const folders = {};
    for (const key in PARAMS) {
      const folder = PARAMS[key].folder || "General";
      if (!folders[folder]) folders[folder] = [];
      folders[folder].push(key);
    }

    for (const folderName in folders) {
      const section = document.createElement("div");
      section.className = "ctrl-section";
      section.innerHTML = `<h3>${folderName}</h3>`;

      for (const key of folders[folderName]) {
        const p = PARAMS[key];
        const group = document.createElement("div");
        group.className = "ctrl-group";
        const label = p.label || key;

        if (p.options) {
          const opts = p.options.map(o =>
            `<option value="${o}"${o === p.value ? " selected" : ""}>${o}</option>`
          ).join("");
          group.innerHTML = `<label>${label}</label>
            <select class="ctrl-select" data-key="${key}">${opts}</select>`;
          group.querySelector("select").addEventListener("change", function () {
            paramValues[key] = this.value;
          });
        } else if (p.type === "color") {
          group.innerHTML = `<label>${label}</label>
            <div class="ctrl-row">
              <input type="color" class="ctrl-color" data-key="${key}" value="${p.value}">
              <span class="color-hex" id="hex-${key}">${p.value}</span>
            </div>`;
          group.querySelector("input").addEventListener("input", function () {
            paramValues[key] = this.value;
            document.getElementById("hex-" + key).textContent = this.value;
          });
        } else if (typeof p.value === "boolean") {
          group.innerHTML = `<label>
            <input type="checkbox" class="ctrl-check" data-key="${key}"${p.value ? " checked" : ""}> ${label}
          </label>`;
          group.querySelector("input").addEventListener("change", function () {
            paramValues[key] = this.checked;
          });
        } else {
          group.innerHTML = `<label>${label}</label>
            <div class="ctrl-row">
              <input type="range" data-key="${key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.value}">
              <span class="ctrl-val" id="val-${key}">${p.value}</span>
            </div>`;
          group.querySelector("input").addEventListener("input", function () {
            paramValues[key] = parseFloat(this.value);
            document.getElementById("val-" + key).textContent = this.value;
          });
        }

        section.appendChild(group);
      }

      container.appendChild(section);
    }
  }

  // ── Three.js setup ──
  function createScene() {
    const container = document.getElementById("canvas-container");
    container.innerHTML = "";

    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    // Scene
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    // Clock
    clock = new THREE.Clock();

    // Reset seeded random
    window.seededRandom = mulberry32(currentSeed);

    if (SKETCH_META.renderMode === "shader") {
      setupShaderMode();
    } else {
      setupSceneMode();
    }

    // Start animation
    isPaused = false;
    document.getElementById("btn-pause").textContent = "Pause";
    animate();
  }

  function setupSceneMode() {
    // Camera
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
    camera.position.set(0, 0, 5);

    // OrbitControls
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    // Let sketch populate the scene
    sketchState = sceneSetup(THREE, scene, camera, renderer, paramValues, currentSeed) || {};
  }

  function setupShaderMode() {
    // Orthographic camera for fullscreen quad
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    controls = null;

    // Build uniforms
    const userUniforms = shaderUniforms(paramValues, currentSeed) || {};
    shaderUniformsObj = Object.assign({
      u_time: { value: 0.0 },
      u_resolution: { value: new THREE.Vector2(
        window.innerWidth * renderer.getPixelRatio(),
        window.innerHeight * renderer.getPixelRatio()
      ) },
      u_mouse: { value: new THREE.Vector2(0.5, 0.5) },
      u_seed: { value: currentSeed },
    }, userUniforms);

    const vertexShader = `void main() { gl_Position = vec4(position, 1.0); }`;

    const material = new THREE.ShaderMaterial({
      uniforms: shaderUniformsObj,
      vertexShader: vertexShader,
      fragmentShader: fragmentShader(),
    });

    const geometry = new THREE.PlaneGeometry(2, 2);
    shaderMesh = new THREE.Mesh(geometry, material);
    scene.add(shaderMesh);

    // Track mouse
    renderer.domElement.addEventListener("mousemove", function (e) {
      shaderUniformsObj.u_mouse.value.set(
        e.clientX / window.innerWidth,
        1.0 - e.clientY / window.innerHeight
      );
    });
  }

  function animate() {
    animationId = requestAnimationFrame(animate);
    if (isPaused) return;

    const delta = clock.getDelta();
    const time = clock.getElapsedTime();

    if (SKETCH_META.renderMode === "shader") {
      shaderUniformsObj.u_time.value = time;
      if (typeof shaderAnimate === "function") {
        shaderAnimate(shaderUniformsObj, paramValues, time);
      }
    } else {
      if (controls) controls.update();
      sceneAnimate(THREE, scene, camera, sketchState, paramValues, time, delta);
    }

    renderer.render(scene, camera);
  }

  // ── Seed system ──
  function applySeed(seed) {
    currentSeed = seed;
    document.getElementById("seed-input").value = seed;
    destroyScene();
    createScene();
  }

  function destroyScene() {
    if (animationId) cancelAnimationFrame(animationId);
    animationId = null;
    if (controls) controls.dispose();
    if (renderer) renderer.dispose();
    // Dispose scene objects
    if (scene) {
      scene.traverse(function (obj) {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) {
            obj.material.forEach(m => m.dispose());
          } else {
            obj.material.dispose();
          }
        }
      });
    }
    scene = null;
    camera = null;
    controls = null;
    sketchState = undefined;
    shaderMesh = null;
    shaderUniformsObj = null;
  }

  // ── Export ──
  function exportPNG() {
    if (!renderer) return;
    renderer.domElement.toBlob(function (blob) {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = (SKETCH_META.title || "sketch") + "_seed" + currentSeed + ".png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }, "image/png");
  }

  // ── Init ──
  function init() {
    document.getElementById("display-title").textContent = SKETCH_META.title;
    document.getElementById("display-concept").textContent = SKETCH_META.concept;
    document.getElementById("sketch-title").textContent = SKETCH_META.title + " — 3D Algorithmic Art";

    buildControls();
    createScene();

    // Sidebar toggle
    const sidebar = document.getElementById("sidebar");
    document.getElementById("sidebar-toggle").addEventListener("click", function () {
      sidebar.classList.toggle("open");
    });

    // Seed controls
    document.getElementById("seed-input").addEventListener("change", function () {
      const v = parseInt(this.value);
      if (v && v > 0) applySeed(v);
    });
    document.getElementById("btn-seed-prev").addEventListener("click", function () {
      applySeed(Math.max(1, currentSeed - 1));
    });
    document.getElementById("btn-seed-next").addEventListener("click", function () {
      applySeed(currentSeed + 1);
    });
    document.getElementById("btn-seed-random").addEventListener("click", function () {
      applySeed(Math.floor(Math.random() * 999999) + 1);
    });

    // Export & control buttons
    document.getElementById("btn-png").addEventListener("click", exportPNG);
    document.getElementById("btn-pause").addEventListener("click", function () {
      isPaused = !isPaused;
      this.textContent = isPaused ? "Play" : "Pause";
      if (!isPaused) {
        clock.getDelta(); // flush accumulated delta
      }
    });
    document.getElementById("btn-reset").addEventListener("click", function () {
      applySeed(currentSeed);
    });

    // Resize
    window.addEventListener("resize", function () {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h);
      if (camera.isPerspectiveCamera) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      if (shaderUniformsObj && shaderUniformsObj.u_resolution) {
        const pr = renderer.getPixelRatio();
        shaderUniformsObj.u_resolution.value.set(w * pr, h * pr);
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
